[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rahavard"
version = "0.0.78"
description = "Re-Usable Utils to Be Used on Our Django Projects"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Davoud Arsalani", email = "d_arsalani@yahoo.com" },
]
keywords = ["python", "django", "utils", "persian", "jalali"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Framework :: Django",
    "License :: OSI Approved :: MIT License",
    "Topic :: Utilities",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "beautifulsoup4",
    "convert_numbers",
    "django",
    "jdatetime",
    "natsort",
]

[project.urls]
Homepage = "https://github.com/davoudarsalani/rahavard"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
packages = ["rahavard"]

[tool.pytest.ini_options]
testpaths = ["rahavard"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "I"]
ignore = [
    "E501",   # line length handled by formatter
]
